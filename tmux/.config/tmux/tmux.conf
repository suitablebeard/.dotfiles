# =====================
# ====== Options ======
# =====================

# Server options
set -s escape-time 0
set -s focus-events on
set -s extended-keys on

# General options
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

set -g history-limit 10000
set -g mode-keys vi
set -g mouse on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#{pane_title}"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Copying to system clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel "wl-copy"

# ====================
# ===== Keybinds =====
# ====================

# Sourcing tmux.conf
unbind r
bind r source ~/.config/tmux/tmux.conf

# Create pane/window in CWD
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Shift+arrow-keys to cycle windows
bind -n S-Left previous-window
bind -n S-Right next-window

# ======================
# ===== Appearance =====
# ======================

# Catppuccin Machiato theme colors
thm_bg="#24273a"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_red="#ee99a0"
thm_blue="#82aaff"
thm_orange="#f0c6c6"
thm_green="#8bd5ca"
thm_black4="#444a73"

backup_thm_green="#c3e88d"
backup_thm_yellow="#ffc777"
backup_thm_red="#ff757f"
backup_thm_pink="#ff757f"

# Status bar
set -g status "on"
set -g status-position bottom
set -g status-bg "${thm_bg}"
set -g status-justify "centre"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# Statusline - left side
set -g status-left "#{?client_prefix,#[fg=${thm_red}],#[fg=${thm_blue}]}#[bg=${thm_bg}]#{?client_prefix,#[bg=${thm_red}],#[bg=${thm_blue}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] #S#[bg=${thm_bg},fg=${thm_gray}]"

# Statusline - right side
set -g status-right "#[fg=${thm_green},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_green},nobold,nounderscore,noitalics]󰒓 #[fg=${thm_fg},bg=${thm_gray}] #W #[fg=${thm_blue},bg=${thm_gray},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_blue},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_gray}] #h "

# Statusline - current window
set -g window-status-current-format "#[fg=${thm_magenta},bg=${thm_bg}] #[fg=${thm_black},bg=${thm_magenta}] #I #[fg=${thm_magenta},bg=${thm_bg}]"

# Statusline - other windows
set -g window-status-format "#[fg=${thm_blue},bg=${thm_bg}] #[fg=${thm_black},bg=${thm_blue}]#I#[fg=${thm_blue},bg=${thm_bg}]"

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"

